spring.application.name=attribution
server.port=8080

# H2, file-backed. PostgreSQL mode keeps the entity DDL portable.
spring.datasource.url=jdbc:h2:file:./data/cryptofraud;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

etherscan.base-url=https://api.etherscan.io/v2/api
etherscan.api-key=${ETHERSCAN_API_KEY:YourApiKeyToken}

trace.max-hops=5
trace.max-fanout=20
trace.max-nodes=200

# Demo safety net: replay the last good trace instead of calling the chain.
trace.prefer-cached=false

labels.seed-on-startup=true
logging.level.com.cryptofraud.attribution=INFO
